<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="#E84142"/>

  <!-- House body (walls) -->
  <rect x="7" y="27" width="34" height="16" rx="1.5" fill="white"/>

  <!-- Door -->
  <rect x="19" y="31" width="10" height="12" rx="2" fill="#E84142"/>

  <!-- Roof W-shape (double gable = W = Wasi) -->
  <polyline
    points="3,27 13,10 24,20 35,10 45,27"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Network nodes at W peaks — represent AI agents connecting home -->
  <circle cx="13" cy="10" r="2.8" fill="white"/>
  <circle cx="35" cy="10" r="2.8" fill="white"/>
  <circle cx="24" cy="20" r="2" fill="rgba(255,255,255,0.7)"/>
  <circle cx="3"  cy="27" r="1.6" fill="rgba(255,255,255,0.5)"/>
  <circle cx="45" cy="27" r="1.6" fill="rgba(255,255,255,0.5)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none">

  <!-- ─── Icon mark ─────────────────────────────────────────────── -->
  <rect width="52" height="52" rx="13" fill="#E84142"/>

  <!-- House walls -->
  <rect x="8" y="29" width="36" height="18" rx="2" fill="white"/>

  <!-- Door -->
  <rect x="20" y="33" width="12" height="14" rx="2" fill="#E84142"/>

  <!-- Roof — double gable (W shape = Wasi) -->
  <polyline
    points="3,29 14,11 26,22 38,11 49,29"
    stroke="white"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Node dots at roof peaks — AI agents connecting home -->
  <circle cx="14" cy="11" r="3"   fill="white"/>
  <circle cx="38" cy="11" r="3"   fill="white"/>
  <circle cx="26" cy="22" r="2.2" fill="rgba(255,255,255,0.75)"/>
  <circle cx="3"  cy="29" r="1.8" fill="rgba(255,255,255,0.45)"/>
  <circle cx="49" cy="29" r="1.8" fill="rgba(255,255,255,0.45)"/>

  <!-- ─── Wordmark ───────────────────────────────────────────────── -->
  <!-- "Wasi" dark + "AI" red -->
  <text
    x="68"
    y="24"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="20"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#111827"
  >Wasi</text>
  <text
    x="116"
    y="24"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="20"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#E84142"
  >AI</text>

  <!-- Tagline -->
  <text
    x="68"
    y="40"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="8.5"
    font-weight="600"
    letter-spacing="1.2"
    fill="#9ca3af"
  >THE HOME OF AI AGENTS</text>
</svg>

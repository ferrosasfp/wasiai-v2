version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Group low-risk dev/test tooling into a single PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Group runtime patch/minor bumps so security/maintenance updates land
      # together instead of one PR per package.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
